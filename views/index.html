<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-logo">&#9889;</span><span>letz<span class="brand-accent">Control</span></span></div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="avatar" id="userAvatar"></span>
        <div class="user-meta"><span id="currentUser"></span><span class="user-role" id="userRole"></span></div>
      </div>
      <button id="logoutBtn" class="btn btn-ghost btn-sm" title="Log out">&#128268;</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost hamburger" id="menuBtn" aria-label="Menu">&#9776;</button>
      <div class="topbar-title"><h1 id="pageTitle"></h1><div class="topbar-sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <button class="search-trigger" id="searchBtn" title="Search pages, sites and databases (Ctrl+K)">
        <span>&#8981;</span><span class="st-label">Search…</span><kbd>Ctrl K</kbd>
      </button>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
